name: Weekly Green Deal Digest

on:
  schedule:
    # Every day at 04:00 UTC (= 06:00 CEST in summer / 05:00 CET in winter;
    # GitHub cron is always UTC and cannot follow daylight saving, and
    # scheduled runs are often delayed by 10-30 minutes under load).
    # Running daily (rather than just weekly) means new publications show
    # up on the site within a day instead of waiting up to a week --
    # DAYS_BACK's 7-day window in fetch_digest.py is unaffected, it just
    # gets recomputed more often. The Sunday occurrence of this daily run
    # still lands well ahead of the Sunday-evening social-post drafting
    # task, so that draft keeps working off a fresh digest either way.
    - cron: "0 4 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium browser
        # Only needed for the headless-browser scrapers in
        # browser_scrapers.py (currently: ECHA, gated behind a JS bot
        # check that plain requests can't clear). --with-deps also
        # installs the system libraries Chromium needs on this runner --
        # skipping it is the #1 cause of "works locally, fails in CI" for
        # Playwright.
        run: playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install translation engine (anylang)
        # The Linguist browser extension's translation core. Used by
        # translate_node.cjs for the EU 27 Ministries sources that have
        # `translate_from:` in sources.yaml. If this step or the
        # translation itself fails, those items are simply dropped (they
        # are never published untranslated) -- the rest of the run is
        # unaffected.
        run: npm install --no-save --no-audit --no-fund anylang

      - name: Run digest script
        # DEEPL_API_KEY (repo secret; a free DeepL API key ending in ":fx")
        # makes DeepL API Free the primary translation engine for the
        # `translate_from:` sources. Without it the unofficial Google/Lingva
        # fallbacks in translate_node.cjs are used.
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python fetch_digest.py

      - name: Commit updated digest
        run: |
          git config user.name "green-deal-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          # NOTE: fetch_digest.py also regenerates site/archive.json (via
          # update_archive()) and site/index.html (via update_static_html()'s
          # pre-rendered no-JS snapshots) on every run -- both must be
          # committed here too, or those changes are silently discarded when
          # the ephemeral runner is torn down and the live site never
          # reflects them (this was previously happening unnoticed).
          # translation_cache.json: machine translations are cached so each
          # text is only ever translated once (see translation.py).
          git add digest.md site/digest.json site/archive.json site/index.html
          git add translation_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Digest update"
          git push
