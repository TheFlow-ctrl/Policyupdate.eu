  #    institutional reference (member CVs, plenary-session agendas ~2x/
  #    year, an "other documents" list last added to in 2020) rather than
  #    news-style content -- a poor fit for a 7-day rolling digest. Worth
  #    knowing about, not worth tracking as a feed.
  #  - EPRS "EU competition policy" tag (epthinktank.eu/tag/eu-competition-
  #    policy) -- a real, genuinely pre-scoped RSS feed (same idea as
  #    Eurocities' topic page elsewhere in this file), confirmed working --
  #    but effectively dormant: newest tagged post is from Sep 2024, over a
  #    year old at last check, before that Oct 2023. Too infrequent to be
  #    worth a dedicated entry, unlike Chillin'Competition's ~2-month gap
  #    above -- EPRS's own general feed is already tracked under
  #    green-deal separately.
  #  - BCCP (Brussels Centre for Competition Policy, VUB,
  #    bccp.research.vub.be) -- a real, current competition-and-industrial-
  #    -policy research centre (active project list, includes VUB's own
  #    Brussels School of Governance). Its own site has no news/blog
  #    section at all (Home/Members/Sunajust/Publications/Events only),
  #    and "Publications" links out to VUB's CRIS research portal
  #    (cris.vub.be), which redirected to a VUB login page (cris-idp.vub.be)
  #    on a plain browser visit -- no accessible RSS/export link found.
  #    Worth a second look with inside knowledge of the CRIS system, since
  #    this is the user's own institution.
  #  - Concurrences (concurrences.com) -- its "e-Competitions" bulletin,
  #    the actual news/case-note content, sits behind a paywall. Same
  #    reasoning as Euractiv elsewhere in this file: scraping a
  #    commercial subscription publication's paywalled content at scale
  #    is a different situation from scraping an org's own free
  #    press releases, so not built.
  #  - Global Competition Review (globalcompetitionreview.com) -- a
  #    subscription trade publication; a plain fetch timed out after
  #    180s with no result, consistent with (not just guessed from) its
  #    known paywall/bot-defended business model. Not built.
  #  - CJEU / General Court (curia.europa.eu) -- would be the single best
  #    source for actual competition-law developments (merger appeals,
  #    Article 101/102 rulings), but the site runs on a legacy JBoss
  #    "JCMS Portlet" CMS with non-semantic auto-generated element IDs and
  #    unstable direct-link redirects (confirmed by hand: several direct
  #    case-law URLs either 302-redirected to the homepage or returned
  #    raw portlet-config data instead of content). A real, named gap --
  #    revisit if a cleaner access path turns up (an EUR-Lex case-law RSS
  #    query, for instance), but not worth the fragile scraper right now.
  #  - National competition authorities (Bundeskartellamt, Autorité de la
  #    concurrence, ACM, etc.) -- deliberately out of scope for now, per
  #    the "core + digital markets" scoping decision: this field tracks EU
  #    -level competition law, not the 27 member states' national
  #    enforcement individually. Revisit if there's demand for it.

