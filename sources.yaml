  - name: European Liberal Forum (Renew)
    url: https://liberalforum.eu/feed/
    field: security
    actor_type: political
    # Official Renew Europe-affiliated think tank. Publishes some
    # green-deal-adjacent content too -- reaches that tab via cross-tagging.
  - name: Transform Network
    url: https://transform-network.net/feed/
    field: security
    actor_type: political
    # Linked to the transform! europe / Left-group political network.

# Removed after real content-quality problems (not a feed/technical issue):
