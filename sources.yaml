# List of feeds/scrapers to track, grouped by policy field.
# "field" must match one of the tab IDs in site/index.html
# (green-deal, security, tech, health, competition) so the website can
# filter by it.
#
# Every entry with field: green-deal is additionally checked against the
# GREEN_DEAL_KEYWORDS list in fetch_digest.py before being included, since
# some sources (Corporate Europe Observatory) cover topics well beyond
# the Green Deal / environmental policy. field: competition sources get
# the SAME treatment against a separate list, COMPETITION_KEYWORDS (see
# the dedicated Competition law section below) -- both fields need a
# keyword gate because their broad official sources (a Commissioner's
# press corner feed, a multi-topic standards body) aren't narrowly
# scoped to just that one topic. Sources tagged with other fields
# (security, tech, health) are NOT keyword-filtered against the FULL
# feed -- every source under those fields is already handpicked to be
# single-topic -- but see the cross-tagging note below.
#
# Cross-tagging: sources whose primary field isn't green-deal (the
# security- and competition-tagged ones) are STILL checked against the
# green-deal keyword filter. Any of their entries that match get an
# *additional* copy tagged field: green-deal (their own entries stay
# under their primary field too). This is how e.g. an ECFR piece
# specifically about EU climate diplomacy can surface on the Green Deal
# tab without moving all of ECFR's foreign-policy content there -- and,
# for competition, how a State-aid decision approving a renewable-energy
# scheme can surface on both tabs.
#
# actor_type classifies the SOURCE itself (not the article), one of:
#   think-tank    -- independent research institute
#   academic      -- peer-reviewed journal, scholarly publisher, or a
#                    university/research-institution output stream (EUI
#                    units, Open Research Europe, Zenodo -- see the
#                    Academic sources section below for notes on each)
#   political     -- political-party-affiliated (EP group foundations etc.)
#   industry      -- trade associations and corporate/sector lobby groups
#   trade-union   -- labour/worker organisations (distinct from ngo: they
#                    represent members' employment interests, not a public-
#                    interest advocacy mandate; distinct from industry: they
#                    sit opposite employers, not alongside them)
#   ngo           -- advocacy NGOs, campaign groups, watchdog organisations
#   eu-institution -- an official EU institution/agency publishing about
#                    itself or its own work (EPRS, CORDIS, EEA...) -- not
#                    independent, not peer-reviewed academic output, not
#                    party-affiliated, so none of the other categories fit
#   international-org -- a global/international body (IEA, UNEP, WMO...),
#                    distinct from eu-institution: these are NOT EU bodies
#                    and publish about the whole world, not the EU
#                    specifically -- see the stricter relevance gate note
#                    just below for why that distinction matters here.
#   media         -- independent journalism/analysis outlets (Clean Energy
#                    Wire, Carbon Brief), distinct from every category
#                    above: not an official body's own voice, not an org's
#                    own advocacy or research output, not a global body's
#                    own reporting -- a third party reporting ON all of them.
# This is a judgment call for a few borderline orgs (documented inline
# where relevant) -- adjust freely if you disagree with a classification.
#
# Academic sources get an EXTRA layer of filtering in fetch_digest.py on
# top of the standard field: green-deal keyword filter: an EU-specificity
# gate (is_eu_relevant()), since journals/repositories publish globally and
# a topic-only match (e.g. "renewable energy policy") says nothing about
# whether the piece is even about the EU. See fetch_digest.py's
# EU_CONTEXT_KEYWORDS / ACADEMIC_TOPIC_KEYWORDS for the exact logic.
#
# international-org sources get a DIFFERENT extra layer: is_io_relevant()
# is an OR-gate (EU-relevant OR a global climate-policy benchmark like
# "1.5C" / "state of the global climate" / IPCC), not the academic gate's
# strict AND -- these sources are worth keeping for genuinely global
# headline climate reporting just as much as for EU-specific coverage. See
# fetch_digest.py's IO_GLOBAL_BENCHMARK_KEYWORDS for the exact list.
#
# eu_gate: true is a separate, per-source flag (independent of actor_type)
# for globally-focused sources that are NOT academic journals or official
# international bodies -- e.g. Ember (global energy think tank), Carbon
# Brief (global climate journalism), Climate Bonds Initiative (global
# green-bond standard-setter), ShareAction (UK-based investor-advocacy
# NGO). These get the SAME strict EU-specificity AND-gate as academic
# sources (is_eu_relevant()), not the looser international-org OR-gate --
# per the user's explicit instruction, a "rigid" EU-relevance filter on
# globally-focused outlets, with no benefit-of-the-doubt for a purely
# global item just because it hits a 1.5C-style benchmark keyword. See
# apply_relevance_filter()'s eu_gate handling in fetch_digest.py.
#
# field: competition (added Sep 2026, at the request of law-firm contacts
# interested in EU competition-law tracking) -- scoped to "core + digital
# markets": antitrust/cartel enforcement, merger control, State aid, and
# the Digital Markets Act, not the full breadth of EU economic regulation
# (no consumer protection, no procurement, no sector-specific regulatory
# regimes). Sources are weighted toward official bodies per that same
# decision -- the Commission's own Competition Press Corner feed and the
# DMA's own news feed, plus a couple of practitioner-facing legal-analysis
# blogs. Kept HIDDEN (disabled "Coming soon" tab in site/index.html) until
# reviewed, same as security currently is, even though (unlike security)
# it has its own keyword filter -- see COMPETITION_KEYWORDS in
# fetch_digest.py. National competition authorities (Autorité de la
# concurrence, Bundeskartellamt, etc.) and the EU courts (CJEU/General
# Court case law) are deliberately out of scope for now -- see the notes
# in the Competition law section below for why.
#
# Entries with a "scraper" key (instead of "url") are handled by
# backend_scrapers.py, for sites with no working RSS/Atom feed.
#
# Last full review: August 2026.

