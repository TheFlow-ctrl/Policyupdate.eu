# List of RSS feeds to track, grouped by policy field.
# "field" must match one of the tab IDs in site/index.html
# (green-deal, security, tech, health) so the website can filter by it.
#
# Confirmed working (checked July 2026):
sources:
  - name: Bruegel
    url: https://www.bruegel.org/rss.xml
    field: green-deal
  - name: E3G
    url: https://www.e3g.org/feed
    field: green-deal
  - name: CAN Europe
    url: https://caneurope.org/feed
    field: green-deal
  - name: IEEP
    url: https://ieep.eu/feed
    field: green-deal
  - name: ECFR
    url: https://ecfr.eu/feed
    field: green-deal

