# List of RSS feeds to track, grouped by policy field.
# "field" must match one of the tab IDs in site/index.html
# (green-deal, security, tech, health) so the website can filter by it.
#
# Every entry pulled from these feeds is additionally checked against the
# GREEN_DEAL_KEYWORDS list in fetch_digest.py before being included, since
# some sources (ECFR, Corporate Europe Observatory) cover topics well beyond
# the Green Deal / environmental policy.
#
# Confirmed working (checked August 2026):
sources:
  - name: Bruegel
    url: https://www.bruegel.org/rss.xml
    field: green-deal
  - name: E3G
    url: https://www.e3g.org/feed
    field: green-deal
  - name: CAN Europe
    url: https://caneurope.org/feed
    field: green-deal
  - name: IEEP
    url: https://ieep.eu/feed
    field: green-deal
  - name: ECFR
    url: https://ecfr.eu/feed
    field: green-deal
  - name: EEB (European Environmental Bureau)
    url: https://eeb.org/feed/
    field: green-deal
  - name: Carbon Market Watch
    url: https://carbonmarketwatch.org/feed/
    field: green-deal
  - name: Zero Waste Europe
    url: https://www.zerowasteeurope.eu/feed/
    field: green-deal
  - name: Corporate Europe Observatory
    url: https://corporateeurope.org/en/rss.xml
    field: green-deal
  - name: I4CE (Institute for Climate Economics)
    url: https://www.i4ce.org/feed/
    field: green-deal
  - name: Sandbag
    url: https://sandbag.be/feed/
    field: green-deal
  - name: Bellona
    url: https://bellona.org/feed
    field: green-deal
  - name: RAP Europe (Regulatory Assistance Project)
    url: https://www.raponline.org/feed/
    field: green-deal

