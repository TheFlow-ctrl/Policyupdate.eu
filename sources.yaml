  # --- Academic / research institutions ---------------------------------------
  - name: FSR Climate (Florence School of Regulation, EUI)
    url: https://fsr.eui.eu/energy/climate/feed/
    field: green-deal
    actor_type: academic
    # Already scoped to Climate content specifically. WordPress site sits
    # behind a WAF that returns an empty body to non-browser User-Agents --
    # fetch_digest.py now sends a normal browser UA on every feed request
    # (FEED_REQUEST_HEADERS) to avoid this; flag if it still comes back empty.
  - name: STG Climate (School of Transnational Governance, EUI)
    url: "https://cadmus.eui.eu/server/opensearch/search?format=rss&scope=c1070db1-ef89-5fd3-bc26-9b6d0bfe138a&query=climate"
    field: green-deal
    actor_type: academic
    # STG's own site has no RSS; this is EUI's institutional repository
    # (Cadmus, DSpace-based) OpenSearch endpoint, scoped to the STG
    # community + a "climate" query. Caveat: many records only carry a
    # placeholder "01 Jan <year>" date and results aren't reliably
    # newest-first, so this source may under-deliver on the weekly
    # recency cutoff -- worth revisiting if it produces ~0 items for a
    # while despite STG actively publishing.
  - name: Open Research Europe (ORE)
    url: https://open-research-europe.ec.europa.eu/published/rss
    field: green-deal
    actor_type: academic
    # Broad by necessity: ORE is EU-funded (Horizon Europe) open-access
    # publishing across ALL research disciplines, and its query parameter
    # is confirmed to NOT scope the feed (tested -- ?q=climate returns the
    # identical unfiltered stream). Relies entirely on the EU-specificity +
    # topic filter described above.
  - name: Zenodo
    scraper: zenodo
    field: green-deal
    actor_type: academic
    # General-purpose open research repository, not EU-specific by nature
    # and has no RSS/Atom feed -- uses backend_scrapers.py's scrape_zenodo,
    # which queries Zenodo's REST API directly with a Green Deal/EU-law
    # search string (see ZENODO_QUERY_TERMS there).

  # --- EU institutions ---------------------------------------------------
  # Official EU institutions/agencies reporting on themselves or their own
  # work -- not independent research, so kept separate from actor_type:
  # academic/think-tank (see the actor_type note at the top of this file).
  # No EU-specificity gate applies to this category (unlike academic) since
  # everything here is inherently EU by definition -- the standard
  # green-deal topic filter is enough.
  - name: CORDIS
    url: "https://cordis.europa.eu/search/en?q=contenttype%3D%27news%27%20AND%20%28relations%2Fcategories%2FapplicationDomain%2Fcode%3D%27env%27%20OR%20relations%2Fcategories%2FapplicationDomain%2Fcode%3D%27ener%27%29%20AND%20language%3D%27en%27&p=1&num=20&format=rss"
    field: green-deal
    actor_type: eu-institution
    # European Commission's own EU-funded-research database. Query is
    # pre-scoped via CORDIS's "Domain of Application" taxonomy to
