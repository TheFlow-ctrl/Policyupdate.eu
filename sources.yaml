  # unlike the requests+BeautifulSoup scrapers in backend_scrapers.py) or
  # reverse-engineering that internal API, which could break without notice
  # since it's not a documented public interface. Flagging as a real gap
  # rather than skipping silently -- worth a deliberate call on whether it's
  # worth the added infrastructure.

